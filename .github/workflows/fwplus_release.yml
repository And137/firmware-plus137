# firmware-plus137 (FW+) release build.
#
# Pushing a tag v<major.minor.build>.137<hydra_build> (e.g. v2.8.3.1373) builds every release env in parallel, packs
# the files with bin/fwplus_pack_release.py (version check in every image, Hydra -ota / -noota factory images,
# SHA256SUMS.txt) and creates a DRAFT GitHub release. Review it, add the release notes and publish it by hand.
# It can also be started by hand for an existing tag (Actions -> FW+ release -> Run workflow).
# The build uses the placeholders in variants/esp32/diy/hydra/platformio.ini; no secrets are needed.
name: FW+ release

on:
  push:
    tags: ['v*.137*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v2.8.3.1373'
        required: true
      envs:
        description: >-
          Only these envs, as a JSON list (e.g. ["heltec-v3","heltec-v4"]), to add boards to a published release.
          Builds and uploads them as artifacts only; no release is created or changed. Empty = full release.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: fwplus-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check-version:
    if: github.repository == 'And137/firmware-plus137'
    runs-on: ubuntu-latest
    outputs:
      fwplus: ${{ steps.version.outputs.fwplus }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # The tag must match version.properties + hydra_build.txt, or the images would carry another version.
      - id: version
        run: |
          base=$(python3 -c "import configparser as c; p=c.ConfigParser(); p.read('version.properties'); v=p['VERSION']; print(f\"{v['major'].strip()}.{v['minor'].strip()}.{v['build'].strip()}\")")
          fwplus="137$(tr -d '[:space:]' < hydra_build.txt)"
          if [ "$TAG" != "v${base}.${fwplus}" ]; then
            echo "::error file=hydra_build.txt::tag $TAG does not match v${base}.${fwplus}"
            exit 1
          fi
          echo "fwplus=${fwplus}" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with HYDRA / ESP32 / ESP32S3 / NRF52 / RP2040 in bin/fwplus_pack_release.py.
        env: ${{ fromJSON(inputs.envs || '["hydra", "hydra_psram", "hydraE22P", "hydraE22P_psram", "tbeam", "tlora-v2-1-1_6", "seeed-xiao-s3", "heltec-wsl-v3", "heltec-v3", "heltec-v4", "tbeam-s3-core", "heltec-wireless-paper", "station-g2", "t-deck", "nrf52_promicro_diy_tcxo", "seeed_xiao_nrf52840_kit", "rak4631", "t-echo", "heltec-mesh-node-t114", "heltec-mesh-node-t096", "tracker-t1000-e", "heltec-mesh-pocket-5000-inkhud", "heltec-mesh-pocket-10000-inkhud", "rak_killer_v2", "rp2040-lora", "picow"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini', 'variants/**/*.ini') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install -U platformio

      # The first ESP32 build after a cache miss can lose a race while fetching IDF components; one retry covers it.
      - name: Build ${{ matrix.env }}
        run: pio run -e "${{ matrix.env }}" || pio run -e "${{ matrix.env }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware-*.bin
            .pio/build/${{ matrix.env }}/firmware-*.elf
            .pio/build/${{ matrix.env }}/firmware-*.uf2
            .pio/build/${{ matrix.env }}/firmware-*.zip
          retention-days: 3
          if-no-files-found: error

  # meshtasticd for Linux, built in Debian 12 (Bookworm, = Raspberry Pi OS Bookworm) so the binary runs there.
  build-native:
    needs: check-version
    if: inputs.envs == '' || inputs.envs == null
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl python3 python3-venv build-essential \
            pkg-config libbluetooth-dev libsdbus-c++-dev libgpiod-dev libyaml-cpp-dev libjsoncpp-dev openssl libssl-dev \
            libulfius-dev liborcania-dev libusb-1.0-0-dev libi2c-dev libuv1-dev libcurl4-gnutls-dev libnotify-dev \
            libavahi-client-dev libbsd-dev

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          submodules: recursive

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-native-${{ matrix.arch }}-${{ hashFiles('platformio.ini', 'variants/native/**') }}
          restore-keys: pio-native-${{ matrix.arch }}-

      - name: Install PlatformIO
        run: python3 -m venv /opt/pio && /opt/pio/bin/pip install -U platformio

      - name: Build meshtasticd
        run: /opt/pio/bin/pio run -e native || /opt/pio/bin/pio run -e native

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.arch }}
          path: .pio/build/native/meshtasticd
          retention-days: 3
          if-no-files-found: error

  release:
    needs: [check-version, build, build-native]
    if: inputs.envs == '' || inputs.envs == null
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The pack script comes from the commit that runs this workflow (the tag on a tag push, the branch on a manual
      # run), so a fixed script can repack an older tag.
      - uses: actions/checkout@v7

      # One artifact per env, unpacked to build/<env>/ — the layout fwplus_pack_release.py reads.
      - uses: actions/download-artifact@v8
        with:
          path: build

      - name: Pack the release files
        run: python3 bin/fwplus_pack_release.py build release "${{ needs.check-version.outputs.fwplus }}"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "firmware+ build ${{ needs.check-version.outputs.fwplus }} (${TAG#v})" \
              --notes "Built by GitHub Actions from $TAG. Replace this text with the release notes before publishing."
          fi
