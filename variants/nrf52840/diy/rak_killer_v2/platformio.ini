; fw+ 1375: RAK Killer v2 - SuperMini nRF52840 + Heltec HT-RA62 + DIY breakout PCB (https://github.com/Uroboros67/rak_killer).
; Variant from musznik/firmware (GPL-3.0), updated for 2.8. PRIVATE_HW like the original build.
[env:rak_killer_v2]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = RAK Killer v2
custom_meshtastic_tags = DIY
custom_meshtastic_requires_dfu = true

extends = nrf52840_base
board_level = extra
board = promicro-nrf52840
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/rak_killer_v2
  -D PRIVATE_HW
  -D EXCLUDE_EMOJI ; same flash budget as nrf52_promicro_diy_tcxo
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/rak_killer_v2>
debug_tool = jlink
