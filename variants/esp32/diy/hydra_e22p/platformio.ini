; ============================================================================
; hydra: Hydra-specific settings shared by every Hydra env
; (hydra, hydraE22P, hydraE22P_psram, hydraE22P_idf4). Edit them here only.
;
; USERPREFS_* values are applied on the first boot after a clean flash
; (erase + factory.bin) or after a factory reset. Later changes from the app
; are kept. Other flags take effect on every build.
; To enable a line, remove the leading ';'. Values must not contain spaces,
; except names, SSID and password, which use the '-D NAME="value"' form.
; ============================================================================
[hydra_userprefs]

; OTA loader: yes = add mt-esp32-ota.bin (BLE/Wi-Fi OTA loader) to factory.bin
; and to VS Code Upload (partition ota_1, 0x260000). no = leave it out.
ota_loader = yes

; ESP-IDF settings added to custom_sdkconfig of the Bluetooth envs (not hydraE22P_idf4).
; NimBLE host task on core 1, next to the Meshtastic main loop. On core 0 (default)
; npl_freertos_eventq_remove() races the host task across cores and BLE teardown
; (settings save, reboot) panics with "assertion: ret == pdPASS". Changing this
; rebuilds the framework libraries on the next build.
sdkconfig =
  '# CONFIG_BT_NIMBLE_PINNED_TO_CORE_0 is not set'
  CONFIG_BT_NIMBLE_PINNED_TO_CORE_1=y
  CONFIG_BT_NIMBLE_PINNED_TO_CORE=1

build_flags =
  ; --- Node name: long name up to 39 bytes, short name up to 4 characters ---
  ;'-D USERPREFS_CONFIG_OWNER_LONG_NAME="Nodenam"'
  ;'-D USERPREFS_CONFIG_OWNER_SHORT_NAME="RDNM"'

  ; --- Role ---
  ; Upstream rejects ROUTER, ROUTER_LATE and LOST_AND_FOUND here and falls back
  ; to CLIENT. USERPREFS_ALLOW_ROUTER_ROLES=1 lifts that check; comment it out
  ; to restore the upstream behaviour.
  -D USERPREFS_ALLOW_ROUTER_ROLES=1
  -D USERPREFS_CONFIG_DEVICE_ROLE=meshtastic_Config_DeviceConfig_Role_ROUTER_LATE

  ; --- Initial LoRa TX power, dBm ---
  ; Power set on the SX1262 chip, not at the antenna. The E22P-868M30S power
  ; amplifier adds gain on top, so measure the output with a power meter and
  ; tune it in the app. Region limits are unchanged. Without this line the
  ; firmware default applies (maximum allowed for the region).
  -D USERPREFS_LORACONFIG_TX_POWER=2

  ; --- Router telemetry floor, seconds ---
  ; Lowest interval for device, environment, power, air quality and health
  ; telemetry on ROUTER / ROUTER_LATE on a default channel.
  ; Upstream 43200 (12 h). 14400 = 4 h.
  -D ROUTER_MIN_TELEMETRY_INTERVAL_SECS=14400

  ; --- NeighborInfo over LoRa on the default (public) channel ---
  ; Upstream sends it there only to the app and MQTT. Interval floor stays
  ; 4 h (14400 s). Also enable "Transmit over LoRa" in the NeighborInfo module.
  -D NEIGHBORINFO_ALLOW_DEFAULT_CHANNEL=1

  ; --- Fixed position (degrees, metres). All four lines are needed ---
  ;-D USERPREFS_FIXED_GPS
  ;-D USERPREFS_FIXED_GPS_LAT=51.xxx
  ;-D USERPREFS_FIXED_GPS_LON=16.xxx
  ;-D USERPREFS_FIXED_GPS_ALT=xxx

  ; --- Wi-Fi client ---
  ; On ESP32 Wi-Fi and Bluetooth are exclusive: with Wi-Fi enabled the app
  ; connects over the network (TCP 4403), not BLE. SSID up to 32 bytes,
  ; password up to 64 (at least 8 for WPA2). Keep the outer single quotes;
  ; the password must not contain ' " or \.
  ; Do not commit a real SSID or password: this repository is public.
  ;-D USERPREFS_NETWORK_WIFI_ENABLED=true
  ;'-D USERPREFS_NETWORK_WIFI_SSID="NetwrkName"'
  ;'-D USERPREFS_NETWORK_WIFI_PSK="passwd"'
  ; Mesh over UDP multicast on the LAN: 1 = on, 0 = off (default).
  ;-D USERPREFS_NETWORK_ENABLED_PROTOCOLS=1
  ; IPv6: true / false (default false).
  ;-D USERPREFS_NETWORK_IPV6_ENABLED=false

  ; --- Wi-Fi TX power, units of 0.25 dBm (esp_wifi_set_max_tx_power) ---
  ; Range 8..84 = 2..21 dBm. ESP32 maximum: 84 (nominal 21 dBm, about 20 dBm
  ; in practice). Without this line: ESP-IDF default, i.e. the maximum.
  ; lora.wifi_power set from the app (2..21 dBm) takes precedence;
  ; wifi_power = 0 means the value from this flag.
  -D HYDRA_WIFI_TX_POWER_QDBM=8

; --- Admin public keys ---
; Exactly as the app shows them (base64, 44 characters), one per line, up to
; three. Converted at build time by extra_scripts/userprefs_admin_keys.py; an
; invalid key stops the build. A slot that is empty on the device is refilled
; from here on every boot. Paste the keys below "admin_keys =" (indented) and
; remove their leading ';'. Keep the "admin_keys =" line even with no keys:
; every Hydra env reads it. The list ends at the next blank line.
admin_keys =
  ;KEY_1_FROM_APP_BASE64_44_CHARS=
  ;KEY_2_FROM_APP_BASE64_44_CHARS=
  ;KEY_3_FROM_APP_BASE64_44_CHARS=

; HydraE22P - Meshtastic DIY v1 hardware with some specific changes
[env:hydraE22P]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = HYDRAE22P
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = HydraE22P
custom_meshtastic_tags = DIY

extends = esp32_base
custom_ota_loader = ${hydra_userprefs.ota_loader}
custom_admin_keys = ${hydra_userprefs.admin_keys}
custom_sdkconfig =
  ${esp32_base.custom_sdkconfig}
  ${hydra_userprefs.sdkconfig}
board = esp32doit-devkit-v1
board_check = true
# Opcja 1 (2026-11-06): OnDemand i BroadcastAssist włączone także na HM5, jak w hydraE22P_psram (OnDemand wymaga BroadcastAssist przy linkowaniu).
build_src_filter =
  ${esp32_base.build_src_filter}
# Framework 3.3.12, jak w hydraE22P_psram (develop oczekuje NetworkClientSecure)
platform_packages =
  platformio/tool-mklittlefs@1.203.210628
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12.tar.xz
build_flags =
  ${esp32_base.build_flags}
  ${hydra_userprefs.build_flags}
  ; no DIY_V1 define: HW_VENDOR falls through to PRIVATE_HW (255) in src/platform/esp32/architecture.h
  -D EBYTE_E22
  -I variants/esp32/diy/hydra_e22p
  -ULED_BUILTIN
  -D MAX_NUM_NODES=80 ; hydra: smaller NodeDB for RAM headroom (no PSRAM); full DB drops stale/farthest nodes first
  -D USE_EBYTE_E22P ; Ebyte E22P-868M30S and E22P-915M30S: pin 14 is power/high, not RXEN. Do not use with standard E22 or E22P-433M30S (wrong RF path / damage risk).
  ;-DBOARD_HAS_PSRAM ; If a Wrover or Wroom module with a soldered PSRAM chip is used, the ESP32 will support up to 4 MB of memory.
  ;-D MAX_NUM_NODES=150 ; Tested a PSRAM equipped node with allocated space for 10000 (!) entries in the node database for several weeks without any problems.

; Hydra z modułem WROVER/WROOM z PSRAM (następne płytki). Osobny env, żeby nie zmieniać firmware na obecnych Hydrach bez PSRAM.
; PSRAM zwiększa zużycie IRAM0 (flagi cache-fix), na bazie 2.7 grozi to błędem "IRAM0 segment data does not fit" (issue #11336).
[env:hydraE22P_psram]
extends = esp32_base
custom_ota_loader = ${hydra_userprefs.ota_loader}
custom_admin_keys = ${hydra_userprefs.admin_keys}
custom_sdkconfig =
  ${esp32_base.custom_sdkconfig}
  ${hydra_userprefs.sdkconfig}
# fw+: esp32dev has no PSRAM flag, so the SDK build disabled SPIRAM (spiram=none) and the board reported Total PSRAM 0.
# freenove_esp32_wrover carries -DBOARD_HAS_PSRAM in its extra_flags; esp32_pre.py then enables quad SPIRAM (2026-11-06).
board = freenove_esp32_wrover
board_check = true
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = HYDRAE22P_PSRAM
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = HydraE22P PSRAM
custom_meshtastic_tags = DIY
# Opcja 1 (2026-11-04): OnDemand i BroadcastAssist włączone z buildu, dokańczanie elementów FW+ w develop (wcześniej opcja 2 z 2026-11-02).
build_src_filter =
  ${esp32_base.build_src_filter}
build_flags =
  ${esp32_base.build_flags}
  ${hydra_userprefs.build_flags}
  -D EBYTE_E22
  -I variants/esp32/diy/hydra_e22p
  -ULED_BUILTIN
  -D USE_EBYTE_E22P
  -D MAX_NUM_NODES=1000
  -D MESHTASTIC_BOOT_CACHE_BUDGET=50000 ; hydra: PSRAM variant only; 1000-node PacketHistory (40 KB) + caches = 48020 B
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw
# Pin framework 3.3.12: develop config expects NetworkClientSecure (present in 3.3.12, not in the classic 2.0.17 package)
platform_packages =
  platformio/tool-mklittlefs@1.203.210628
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12.tar.xz
; Test 2026-11-03: ten sam env na platformie/frameworku z v27 (IDF 4.4, espressif32@6.13.0), żeby sprawdzić czy Wi-Fi AUTH_EXPIRE wynika z IDF 5 w pioarduino.
[env:hydraE22P_idf4]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = HYDRAE22P
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = HydraE22P IDF4
custom_meshtastic_tags = DIY

extends = esp32_base
custom_ota_loader = ${hydra_userprefs.ota_loader}
custom_admin_keys = ${hydra_userprefs.admin_keys}
platform = platformio/espressif32@6.13.0
board = esp32doit-devkit-v1
board_check = true
build_flags =
  ${esp32_base.build_flags}
  ${hydra_userprefs.build_flags}
  -D EBYTE_E22
  -I variants/esp32/diy/hydra_e22p
  -ULED_BUILTIN
  -D MAX_NUM_NODES=80
  -D USE_EBYTE_E22P
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1 ; hydra test IDF4.4: NimBLE 2.x API z IDF5 nie kompiluje się na 1.x; BT do osobnego portu
build_src_filter =
  ${esp32_base.build_src_filter} -<modules/OnDemandModule.cpp> -<modules/BroadcastAssistModule.cpp> -<platform/extra_variants/>
